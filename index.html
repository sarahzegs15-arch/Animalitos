<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Patitas y Mimitos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patitas y Mimitos">
<meta name="theme-color" content="#14123a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#14123a;color:#fff;touch-action:manipulation;
  font-family:"Marker Felt","Chalkboard SE","Arial Rounded MT Bold","Trebuchet MS",sans-serif}
#sky{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 100%,#3a2d7a 0%,#1f1a4f 55%,#12103a 100%);transition:background .6s}
.star{position:absolute;color:#ffe9a3;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.screen.active{opacity:1;visibility:visible}

/* ---------- Inicio ---------- */
#splash{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3vmin 0 5vmin}
#splash .clouds{position:absolute;left:0;right:0;bottom:0;height:34%;width:100%}
.moon{position:absolute;left:5vmin;top:9vmin;width:15vmin;height:15vmin}
.title{position:relative;text-align:center;margin-top:1vmin;z-index:2}
.t1{font-size:11.5vmin;line-height:1;color:#ff8fd2;text-shadow:0 .7vmin 0 #9b3f9e,0 0 3vmin rgba(255,143,210,.55);transform:rotate(-3deg)}
.t2{font-size:11.5vmin;line-height:1;color:#ffd86b;text-shadow:0 .7vmin 0 #b2701f,0 0 3vmin rgba(255,216,107,.5);transform:rotate(-2deg)}
.t2 .y{font-size:6vmin;color:#c9a7ff;text-shadow:0 .4vmin 0 #5b3fa8}
.tag{margin-top:1.4vmin;font-size:3.4vmin;color:#e8defc;letter-spacing:.3vmin}
.cluster{position:relative;width:90vmin;height:46vmin;flex:none;z-index:1}
.pal{position:absolute;width:25vmin;height:27vmin}
.pal svg{width:100%;height:100%;display:block;overflow:visible}
.big-btn{position:relative;z-index:3;display:flex;align-items:center;padding:2.2vmin 6.5vmin 2.2vmin 5vmin;border-radius:10vmin;
  background:linear-gradient(#ff9bcb,#f45fae);font-size:5vmin;color:#fff;text-shadow:0 .3vmin 0 rgba(150,30,100,.5);
  box-shadow:0 .9vmin 0 #b53a86,0 2vmin 4vmin rgba(0,0,0,.35);border:.5vmin solid rgba(255,255,255,.55)}
.big-btn svg{width:6.5vmin;height:6.5vmin;margin-right:2.2vmin}
.big-btn:active{transform:translateY(.6vmin)}
.corner{position:absolute;z-index:5;width:8.5vmin;height:8.5vmin;border-radius:50%;background:rgba(126,112,226,.85);
  display:flex;align-items:center;justify-content:center;box-shadow:0 .6vmin 0 rgba(0,0,0,.28)}
.corner svg{width:62%;height:62%}
#gear{top:2.5vmin;left:2.5vmin}
#gear.hold{background:rgba(255,143,210,.95)}
#muteA{top:2.5vmin;right:2.5vmin}

/* ---------- Selección ---------- */
#select h1{position:absolute;top:2%;left:0;right:0;margin:0;text-align:center;font-weight:normal;font-size:5.2vmin;color:#fff;text-shadow:0 .5vmin 0 rgba(0,0,0,.25)}
.grid{position:absolute;top:13%;left:0;right:0;bottom:3%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center}
.card{position:relative;width:21vw;height:36vh;margin:1vw;border-radius:5vmin;overflow:hidden;box-shadow:0 1vmin 0 rgba(0,0,0,.25),0 2vmin 4vmin rgba(0,0,0,.3);transition:transform .12s}
.card:active{transform:scale(.95)}
.card .pic{position:absolute;top:3%;left:0;right:0;bottom:15%;pointer-events:none}
.card .pic svg{width:100%;height:100%;display:block;pointer-events:none}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:1vmin 0;text-align:center;font-size:3.4vmin;color:#3b2a63;background:rgba(255,255,255,.5);pointer-events:none}
@media (orientation:portrait){.card{width:29vw;height:22vh}}
#homeBtn{left:2.5vmin;top:2.5vmin}

/* ---------- Juego ---------- */
.ptop{position:absolute;top:0;left:0;right:0;height:11%;display:flex;align-items:center;justify-content:space-between;padding:0 3vmin}
.rbtn{position:relative;width:8.5vmin;height:8.5vmin;border-radius:50%;background:rgba(126,112,226,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 .6vmin 0 rgba(0,0,0,.28)}
.rbtn svg{width:62%;height:62%}
.npill{padding:1vmin 7vmin;border-radius:5vmin;font-size:4.8vmin;color:#2e2a52;box-shadow:0 .6vmin 0 rgba(0,0,0,.22)}
.stage{position:absolute;top:11%;left:0;right:0;height:64%}
.stage svg{width:100%;height:100%;display:block;overflow:visible;animation:breathe 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.988)}}
.palette{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);display:flex;padding:1.2vmin 2vmin;background:rgba(20,22,66,.92);border:.5vmin solid #5a50b0;border-radius:6vmin;white-space:nowrap;box-shadow:0 1vmin 3vmin rgba(0,0,0,.4)}
.pbtn{display:flex;flex-direction:column;align-items:center;margin:0 .8vmin}
.pbtn .dot{width:9.2vmin;height:9.2vmin;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -.6vmin 0 rgba(0,0,0,.12);transition:transform .1s}
.pbtn .dot svg{width:70%;height:70%}
.pbtn:active .dot{transform:scale(.88)}
.pbtn .lb{font-size:2.2vmin;margin-top:.5vmin;color:#fff}
.pbtn.pulse .dot{animation:pulse .6s ease 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* ---------- Burbujas y chispas ---------- */
.bubble{position:fixed;z-index:50;padding:1.2vmin 3vmin;border-radius:4vmin;font-size:4.4vmin;color:#3b2a63;white-space:nowrap;pointer-events:none;
  box-shadow:0 .6vmin 0 rgba(0,0,0,.18);transform-origin:50% 100%;animation:pop .26s cubic-bezier(.3,1.6,.5,1) both,fadeout .4s ease 1.5s forwards}
.bubble i{position:absolute;bottom:-1.1vmin;width:2.4vmin;height:2.4vmin;transform:rotate(45deg);background:inherit}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeout{to{opacity:0;transform:translateY(-2vmin)}}
.spark{position:fixed;z-index:49;pointer-events:none;font-size:4.4vmin;margin:-2vmin 0 0 -2vmin;animation:fly .7s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}

/* ---------- Sonido (iconos) ---------- */
.mx{display:none}
body.muted .wave{display:none}
body.muted .mx{display:inline}

/* ---------- Ajustes ---------- */
#settings{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(10,8,40,.8);display:none;align-items:center;justify-content:center}
#settings.open{display:flex}
.panel{width:80vmin;padding:5vmin;border-radius:5vmin;background:#2b2766;border:.6vmin solid #6f63d6;text-align:center}
.panel h2{margin:0 0 3vmin;font-weight:normal;font-size:5vmin;color:#ffd86b}
.panel p{font-size:2.8vmin;color:#cfc6f5;margin:2vmin 0 0}
.opt{display:flex;justify-content:space-between;align-items:center;margin:2vmin 0;padding:2vmin 3vmin;border-radius:3vmin;background:rgba(255,255,255,.1);font-size:3.8vmin}
.sw{min-width:14vmin;padding:1.2vmin 3vmin;border-radius:3vmin;background:#58c98a;color:#103a22;text-align:center}
.sw.no{background:#e57b92;color:#4a1020}
.closeb{display:inline-block;margin-top:2vmin;padding:1.8vmin 8vmin;border-radius:5vmin;background:#f45fae;font-size:4vmin;box-shadow:0 .6vmin 0 #b53a86}
</style>
</head>

</div>

function earG(side,px,py,shapes){
  var cx=side==='L'?px:400-px;
  var inner=side==='L'?shapes:'<g transform="translate(400 0) scale(-1 1)">'+shapes+'</g>';
  return '<g class="part" data-part="orejas" data-cx="'+cx+'" data-cy="'+py+'">'+inner+'</g>';
}
function ears(a){
  if(a.ear==='none') return '';
  var out='';
  ['L','R'].forEach(function(side){
    var fur=side==='L'?(a.earL||a.fur):(a.earR||a.fur);
    var sh='',px=135,py=115;
    if(a.ear==='cat'){
      sh='<path d="M98 128 Q80 55 106 36 Q150 52 172 100 Z" fill="'+fur+'"/><path d="M112 112 Q104 72 116 58 Q142 72 154 100 Z" fill="'+a.inner+'"/>';
    }else if(a.ear==='bunny'){
      sh='<path d="M118 120 Q85 40 125 8 Q175 20 165 112 Z" fill="'+fur+'"/><path d="M132 104 Q112 52 128 26 Q156 38 152 104 Z" fill="'+a.inner+'"/>';
      px=145;py=112;
    }else if(a.ear==='round'){
      sh='<circle cx="104" cy="98" r="40" fill="'+fur+'"/>'+(a.inner?'<circle cx="107" cy="102" r="21" fill="'+a.inner+'"/>':'');
      px=106;py=100;
    }else if(a.ear==='fox'){
      sh='<path d="M96 132 Q84 50 112 20 Q160 48 172 102 Z" fill="'+fur+'"/><path d="M116 118 Q110 82 120 66 Q142 82 152 108 Z" fill="'+a.inner+'"/><path d="M99 72 Q103 42 112 22 Q140 38 155 66 Q128 56 99 72Z" fill="#3a2418"/>';
    }else if(a.ear==='deer'){
      sh='<path d="M96 122 Q38 92 52 48 Q120 50 168 106 Z" fill="'+fur+'"/><path d="M96 110 Q62 92 68 68 Q112 72 150 104 Z" fill="'+a.inner+'"/>';
      if(side==='R'){
        sh+='<g><circle cx="78" cy="60" r="8" fill="#ff9fc2"/><circle cx="89.4" cy="68.3" r="8" fill="#ff9fc2"/><circle cx="85" cy="81.7" r="8" fill="#ff9fc2"/><circle cx="71" cy="81.7" r="8" fill="#ff9fc2"/><circle cx="66.6" cy="68.3" r="8" fill="#ff9fc2"/><circle cx="78" cy="72" r="6" fill="#ffe27a"/></g>';
      }
      px=130;py=115;
    }
    out+=earG(side,px,py,sh);
  });
  return out;
}
function tail(a){
  var c=a.tailColor||a.fur,t=a.tail,pre='<g class="part" data-part="colita" ';

    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C();

    var comp=AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    var len=AC.sampleRate; noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0);

}
function env(g,t0,a,d,v){
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(v,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);

function osc(o){
  var t0=AC.currentTime+(o.at||0)+0.01,p=o.p||1;
  var s=AC.createOscillator(); s.type=o.type||'sine';
  var pts=o.pts; s.frequency.setValueAtTime(pts[0][1]*p,t0);
  for(var i=1;i<pts.length;i++) s.frequency.linearRampToValueAtTime(pts[i][1]*p,t0+pts[i][0]);
  var g=AC.createGain(); env(g,t0,Math.min(0.03,o.d/3),o.d,o.v||0.3);
  var last=s;
  if(o.lp){var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=o.lp; last.connect(f); last=f;}
  last.connect(g); g.connect(master);
  if(o.vib){
    var l=AC.createOscillator(),lg=AC.createGain();
    l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]*p; l.connect(lg); lg.connect(s.frequency);
    l.start(t0); l.stop(t0+o.d+0.05);
  }
  s.start(t0); s.stop(t0+o.d+0.05);
}
function noise(o){
  var t0=AC.currentTime+(o.at||0)+0.01;
  var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  var f=AC.createBiquadFilter(); f.type=o.type||'bandpass'; f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f0,t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t0+o.d);
  var g=AC.createGain(); env(g,t0,Math.min(0.02,o.d/3),o.d,o.v||0.3);

function vocal(o){
  var t0=AC.currentTime+(o.at||0)+0.01,p=(o.p||1)*(1+(Math.random()-0.5)*0.05);

  for(var i=1;i<pts.length;i++) s.frequency.linearRampToValueAtTime(pts[i][1]*p,t0+pts[i][0]);
  var g=AC.createGain(); env(g,t0,Math.min(0.05,o.d/3),o.d,o.v||0.35);

    var fg=AC.createGain(); fg.gain.value=k?2.2:3.2;
    s.connect(f); f.connect(fg); fg.connect(g);

  l.frequency.value=vib[0]; lg.gain.value=vib[1]*p; l.connect(lg); lg.connect(s.frequency);

function animate(el,kind,dur){
  if(!el) return;
  var cx=+el.getAttribute('data-cx'),cy=+el.getAttribute('data-cy');
  var start=null; dur=dur||650;
  var token=(el._tok=(el._tok||0)+1);
  function frame(ts){
    if(el._tok!==token) return;
    if(start===null) start=ts;
    var t=Math.min(1,(ts-start)/dur),a=0,sx=1,sy=1,ty=0,damp=1-t;
    if(kind==='wiggle'){a=Math.sin(t*Math.PI*6)*14*damp;}
    else if(kind==='swing'){a=Math.sin(t*Math.PI*5)*22*damp;}
    else if(kind==='bounce'){var k=Math.sin(t*Math.PI*3)*0.2*damp; sx=1+k; sy=1-k*0.8; ty=-Math.abs(Math.sin(t*Math.PI*3))*9*damp;}
    else if(kind==='pop'){var k2=Math.sin(t*Math.PI*2)*0.3*damp; sx=1+k2; sy=1+k2;}
    else if(kind==='blink'){sy=1-0.9*Math.sin(t*Math.PI);}
    if(t<1){
      el.setAttribute('transform','translate('+cx+' '+(cy+ty)+') rotate('+a+') scale('+sx+' '+sy+') translate('+(-cx)+' '+(-cy)+')');
      requestAnimationFrame(frame);
    }else{ el.removeAttribute('transform'); }
  }
  requestAnimationFrame(frame);
}

/* ---------- Burbujas y chispas ---------- */
var bubbles=[];
function bubble(text,x,y,color){
  var b=document.createElement('div'); b.className='bubble'; b.style.background=color||'#fff'; b.textContent=text;
  var tl=document.createElement('i'); b.appendChild(tl);
  document.body.appendChild(b);
  var w=b.offsetWidth,h=b.offsetHeight,vw=window.innerWidth;
  var left=Math.max(6,Math.min(vw-w-6,x-w/2));
  var top=y-h-36; if(top<6) top=y+36;
  b.style.left=left+'px'; b.style.top=top+'px';
  tl.style.left=Math.max(10,Math.min(w-26,x-left-8))+'px';
  if(top>y){ tl.style.bottom='auto'; tl.style.top='-1.1vmin'; }
  bubbles.push(b);
  if(bubbles.length>4){var o=bubbles.shift(); if(o.parentNode) o.parentNode.removeChild(o);}
  setTimeout(function(){
    if(b.parentNode) b.parentNode.removeChild(b);
    var i=bubbles.indexOf(b); if(i>-1) bubbles.splice(i,1);
  },2000);
}
var SPARK_COLS=['#ffe27a','#ff9fc8','#b8a1ff','#8fe0ff','#ffd0a0'];
function sparkle(x,y,n){
  var chars=['\u2605','\u2665','\u2726','\u2665'];
  n=n||5;
  for(var i=0;i<n;i++){
    var s=document.createElement('div'); s.className='spark'; s.textContent=chars[i%4];
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.color=SPARK_COLS[i%SPARK_COLS.length];
    var ang=Math.random()*Math.PI*2,d=40+Math.random()*50;
    s.style.setProperty('--dx',(Math.cos(ang)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*d-20)+'px');
    document.body.appendChild(s);
    (function(el){setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},760);})(s);
  }
}

/* ---------- Toques (varios dedos a la vez) ---------- */
function bindTap(el,fn){
  el.addEventListener('touchstart',function(e){
    e.preventDefault(); initAudio();
    for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i]; fn(t.target,t.clientX,t.clientY);}
  },{passive:false});
  el.addEventListener('mousedown',function(e){initAudio(); fn(e.target,e.clientX,e.clientY);});
}
function unlockOnce(){initAudio();}
document.addEventListener('touchend',unlockOnce,false);
document.addEventListener('click',unlockOnce,false);
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&AC&&AC.state!=='running'&&AC.resume) AC.resume();
});

/* ---------- Estrellas ---------- */
(function(){
  var sky=$('sky');
  for(var i=0;i<40;i++){
    var d=document.createElement('div'); d.className='star'; d.textContent=(i%3)?'\u2726':'\u2605';
    d.style.left=(Math.random()*100)+'%'; d.style.top=(Math.random()*100)+'%';
    d.style.fontSize=(1.2+Math.random()*2.4)+'vmin'; d.style.animationDelay=(Math.random()*3)+'s';
    sky.appendChild(d);
  }
})();

/* ---------- Navegación ---------- */
var DEFAULT_SKY='radial-gradient(ellipse at 50% 100%,#3a2d7a 0%,#1f1a4f 55%,#12103a 100%)';
var current='splash',animalId=null,svgEl=null,lastTap=Date.now(),blinkT=null,hintT=null;
function show(name){
  ['splash','select','play'].forEach(function(n){$(n).classList.toggle('active',n===name);});
  current=name;
  if(name!=='play'){stopTimers(); $('sky').style.background=DEFAULT_SKY; }
}
function stopTimers(){clearInterval(blinkT);clearInterval(hintT);}
function centerOf(el){var r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}

/* ---------- Inicio: grupito de animales ---------- */
(function(){
  var cl=$('cluster');
  var spots=[['gatita',2,17,25],['conejita',22,17,25],['cervatilla',42,17,25],['zorrita',63,17,25],
             ['panda',11,0,25],['ranita',33,2,22],['osito',54,0,25]];
  spots.forEach(function(s){
    var d=document.createElement('div'); d.className='pal';
    d.style.left=s[1]+'vmin'; d.style.bottom=s[2]+'vmin'; d.style.width=s[3]+'vmin'; d.style.height=(s[3]*1.075)+'vmin';
    d.innerHTML=animalSVG(s[0]);
    cl.appendChild(d);
    bindTap(d,function(t,x,y){
      var a=A[s[0]];
      playSound(VOICE[s[0]],a.pitch);
      animate(d.querySelector('.whole'),'bounce',700);
      bubble(a.voice,x,y,a.card); sparkle(x,y,4);
    });
  });
})();

/* ---------- Selección ---------- */
(function(){
  var g=$('grid');
  ORDER.forEach(function(id){
    var a=A[id];
    var c=document.createElement('div'); c.className='card'; c.style.background=a.card;
    c.innerHTML='<div class="pic">'+animalSVG(id,'45 -10 310 330')+'</div><div class="nm">'+a.name+'</div>';
    g.appendChild(c);
    bindTap(c,function(){
      playSound(VOICE[id],a.pitch);
      openAnimal(id);
    });
  });
})();

/* ---------- Pantalla de juego ---------- */
(function(){
  var pal=$('palette');
  PARTS.forEach(function(p){
    var b=document.createElement('div'); b.className='pbtn'; b.setAttribute('data-p',p);
    b.innerHTML='<div class="dot" style="background:'+DOT[p]+'"><svg viewBox="0 0 40 40">'+ICON[p]+'</svg></div><div class="lb">'+LABEL[p]+'</div>';
    pal.appendChild(b);
    bindTap(b,function(){
      if(!svgEl) return;
      var el=svgEl.querySelector('[data-part="'+p+'"]');
      var c=el?centerOf(el):{x:window.innerWidth/2,y:window.innerHeight/2};
      doPart(p,c.x,c.y);
    });
  });
})();

function openAnimal(id){
  animalId=id; var a=A[id];
  var st=$('stage'); st.innerHTML=animalSVG(id,null,'main');
  svgEl=st.querySelector('svg');
  var np=$('npill'); np.textContent=a.name; np.style.background=a.pill;
  $('sky').style.background=a.sky;
  var btns=$('palette').children;
  for(var i=0;i<btns.length;i++){
    var p=btns[i].getAttribute('data-p');
    btns[i].style.display=svgEl.querySelector('[data-part="'+p+'"]')?'flex':'none';
  }
  show('play');
  lastTap=Date.now();
  startTimers();
  setTimeout(function(){
    if(current!=='play'||animalId!==id) return;
    var r=svgEl.getBoundingClientRect();
    doVoice(r.left+r.width/2,r.top+r.height*0.25);
  },380);
}
function doVoice(x,y){
  var a=A[animalId];
  playSound(VOICE[animalId],a.pitch);
  animate(svgEl.querySelector('.whole'),'bounce',700);
  bubble(a.voice,x,y,a.card); sparkle(x,y,5); lastTap=Date.now();
}
function doPart(part,x,y){
  var a=A[animalId];
  playSound(PART_SND[part],a.pitch);
  var els=svgEl.querySelectorAll('[data-part="'+part+'"]');
  for(var i=0;i<els.length;i++) animate(els[i],ANIM[part],part==='colita'?800:650);
  if(part==='boca'){
    var tg=svgEl.querySelector('.tongue');
    if(tg){tg.setAttribute('opacity','1'); setTimeout(function(){tg.setAttribute('opacity','0');},700);}
  }
  var txt=(a.say&&a.say[part])||SAY[part];
  bubble(txt,x,y,BCOL[part]); sparkle(x,y,5);
  lastTap=Date.now();
}
function findPart(el){
  while(el&&el!==document.body){
    if(el.getAttribute){var p=el.getAttribute('data-part'); if(p) return p;}
    el=el.parentNode;
  }
  return null;
}
bindTap($('stage'),function(target,x,y){
  if(!svgEl) return;
  var p=findPart(target);
  if(p) doPart(p,x,y); else doVoice(x,y);
});
function startTimers(){
  stopTimers();
  blinkT=setInterval(function(){
    if(!svgEl) return;
    var eyes=svgEl.querySelectorAll('[data-blink]');
    for(var i=0;i<eyes.length;i++) animate(eyes[i],'blink',240);
  },3300);
  hintT=setInterval(function(){
    if(!svgEl||Date.now()-lastTap<7000) return;
    var avail=PARTS.filter(function(p){return svgEl.querySelector('[data-part="'+p+'"]');});
    var p=avail[Math.floor(Math.random()*avail.length)];
    var els=svgEl.querySelectorAll('[data-part="'+p+'"]');
    for(var i=0;i<els.length;i++) animate(els[i],'pop',800);
    var c=centerOf(els[0]); sparkle(c.x,c.y,3);
    var btn=$('palette').querySelector('[data-p="'+p+'"]');
    if(btn){btn.classList.add('pulse'); setTimeout(function(){btn.classList.remove('pulse');},1400);}
    lastTap=Date.now()-3000;
  },2500);
}

/* ---------- Botones ---------- */
bindTap($('startBtn'),function(){show('select');});
bindTap($('homeBtn'),function(){show('splash');});
bindTap($('backBtn'),function(){show('select');});
function toggleMute(){
  settings.muted=!settings.muted; saveSettings(); applySettings();
}
bindTap($('muteA'),toggleMute);
bindTap($('muteB'),toggleMute);
bindTap($('npill'),function(t,x,y){if(animalId&&current==='play') doVoice(x,y);});

/* Engrane: mantener presionado para abrir ajustes (candado para bebés) */
(function(){
  var gear=$('gear'),gt=null;
  function start(e){e.preventDefault(); gear.classList.add('hold'); clearTimeout(gt); gt=setTimeout(function(){gear.classList.remove('hold'); $('settings').classList.add('open');},1400);}
  function end(){clearTimeout(gt); gear.classList.remove('hold');}
  gear.addEventListener('touchstart',start,{passive:false});
  gear.addEventListener('mousedown',start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(function(n){gear.addEventListener(n,end);});
})();
bindTap($('swSound'),function(){toggleMute();});
bindTap($('closeSet'),function(){$('settings').classList.remove('open');});
bindTap($('settings'),function(){});

applySettings();

/* ---------- Modo sin internet ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
})();
</script>
